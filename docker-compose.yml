services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Exposed for local inspection; override the host port to avoid conflicts.
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"       # S3 API
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"   # web console

  # One-shot job: creates the buckets on first boot, then exits.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/$${BUCKET_INPUTS} &&
      mc mb -p local/$${BUCKET_OUTPUTS} &&
      mc mb -p local/$${BUCKET_THUMBS} &&
      echo 'buckets ready';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      BUCKET_INPUTS: ${BUCKET_INPUTS}
      BUCKET_OUTPUTS: ${BUCKET_OUTPUTS}
      BUCKET_THUMBS: ${BUCKET_THUMBS}

  # One-shot: applies DB migrations from the built image, then exits.
  migrate:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    env_file: .env
    command: ["node", "packages/api/dist/db/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      # /ready, not /health: an instance that cannot reach Postgres, Redis or
      # MinIO is not serving requests successfully and should not be routed to.
      # 127.0.0.1, not localhost: the app binds IPv4 only, and busybox wget
      # resolves localhost to ::1 first and gets connection refused.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # Reports whether BullMQ is still consuming, not just that the process
      # is alive — a worker that stopped taking jobs looks fine to `ps`.
      # 127.0.0.1 for the same IPv6 reason as the API above.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # The worker finishes its in-flight transcode on SIGTERM. Docker's default
    # 10s grace period would SIGKILL it mid-encode, so allow a long drain.
    stop_grace_period: 10m
    # Scale transcoding horizontally:  docker compose up -d --scale worker=3

  # Gateway: builds the React SPA, serves it, and proxies/caches /api + HLS.
  nginx:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_HOST_PORT:-8080}:80"

volumes:
  pgdata:
  redisdata:
  miniodata:
